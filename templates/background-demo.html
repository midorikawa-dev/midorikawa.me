{% import "macros.html" as macros %}
<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{ page.title }} — {{ config.title }}</title>
        {{ macros::favicon_links() }}
        {{ macros::font_links() }}
        <link rel="stylesheet" href="{{ get_url(path='css/style.css', cachebust=true) }}" />
    </head>
    <body>
        <main class="article-wrap background-demo-wrap">
            {{ macros::site_header(lang="ja") }}

            <article class="article">
                <header class="article-header">
                    <h1>{{ page.title }}</h1>
                    {% if page.description %}
                    <p class="article-description">{{ page.description }}</p>
                    {% endif %}
                </header>

                <div class="article-body">
                    {{ page.content | safe }}
                </div>
            </article>
        </main>
    </body>
</html>
